<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fpcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071338" />
      <stop offset="100%" stop-color="#0E2368" />
    </linearGradient>
  </defs>

  <!-- Background tile with subtle border -->
  <rect width="64" height="64" rx="14" fill="url(#fpcGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- DRC Tricolor Contour -->
  <g transform="translate(6, 6) scale(0.325)">
    <!-- Blue Northern & Western border -->
    <path
      d="M 28 88 C 24 84, 18 84, 14 87 C 10 90, 8 96, 12 98 C 18 100, 24 99, 28 98 C 30 96, 32 94, 33 90 C 35 84, 38 78, 41 72 C 43 65, 45 54, 46 45 C 47 38, 49 34, 52 30 C 55 26, 61 24, 66 23 C 72 22, 79 26, 85 24 C 91 22, 96 17, 102 16 C 108 15, 114 18, 120 17 C 126 16, 131 19, 133 24 C 135 29, 130 35, 131 40 C 132 46, 137 50, 138 56"
      stroke="#38BDF8"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Yellow Eastern border (Great Lakes) -->
    <path
      d="M 138 56 C 136 62, 130 67, 128 73 C 126 79, 129 85, 128 91 C 127 96, 125 102, 127 107 C 129 112, 133 115, 133 120 C 133 124, 129 127, 128 131"
      stroke="#F7C600"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Red Southern border (Katanga) -->
    <path
      d="M 128 131 C 128 137, 134 140, 133 145 C 132 149, 128 151, 123 150 C 117 149, 115 142, 110 138 C 105 134, 100 137, 95 135 C 90 133, 85 124, 82 120 C 79 116, 75 116, 70 115 C 65 114, 59 116, 55 112 C 51 108, 48 102, 45 98 C 42 94, 38 92, 34 91 C 31 90, 28 88, 28 88"
      transform="translate(0, -14)"
      stroke="#D71920"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- FPC bold monogram inside the favicon -->
  <text x="18" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" letter-spacing="-0.5">FPC</text>
  <!-- Distinctive red macron bar over PC -->
  <rect x="27" y="30" width="18" height="2.5" rx="1.25" fill="#D71920" />
</svg>
